
<h5>
        <button class="btn btn-outline-secondary" type="button"
          data-bs-toggle="collapse" data-bs-target="#collapseUnconfirmed"
          aria-expanded="false" aria-controls="collapseUnconfirmed">
          View Unconfirmed Classes
        </button>
</h5>
    <div
        id="collapseUnconfirmed"
        class="collapse table-responsive"
    >

    <hr class="thin-br" />
    <ng-container *ngIf="{ value: deletionModeForUnconfirmedClassesActivated$ | async } as context">
      <div *ngIf="context.value">
        <div class="text-center">
            <h4 class="text-center text-danger">
              Warning
            </h4>
            <h5 class="text-center text-danger">
              Deleting a Class May Influence
            </h5>
            <h5 class="text-center text-danger">
              Past Monthly Earnings Estimates
            </h5>
            <p class="text-center text-danger small-scr">
              (Turn Horizontal to Delete)
            </p>
            <button class="btn btn-outline-danger" 
            (click)="onDeactivateUnconfirmedClassDeletionMode()" type="button">
              Deactivate Deletion Mode
            </button>
          <br />
        </div>
        <br />
      </div>
    </ng-container>
    <ng-container 
    *ngIf="{ value: deletionModeForUnconfirmedClassesActivated$ | async } as context"
  >
    <div *ngIf="!context.value">
      <div class="text-center">
          <button class="btn btn-outline-danger middle" 
          (click)="onActivateUnconfirmedlassDeletionMode()" type="button">
            Activate Deletion Mode
          </button>
        <br />
      </div>
      <br />
    </div>
  </ng-container>
    <table class="table bg-transparent">
        <thead class="table bg-transparent">
          <tr class="row bg-transparent">
            <th class="col bg-transparent">
              <p class="mb-0">Date/Time<br />
                <small class="text-secondary">(click to edit/confirm)</small>
              </p>
            </th>
            <th class="col bg-transparent">
              <p class="mb-0">
                Student/Class<br />
                <small class="text-secondary">(click for attendance)</small>
              </p>
            </th>
            <ng-container
              *ngIf="{ value: deletionModeForUnconfirmedClassesActivated$ | async } as context"
            >
              <th *ngIf="context.value" class="col bg-transparent hidden-small"
              >
              <p>
                Delete
              </p>
            </th>
            </ng-container>
          </tr>
        </thead>
        <tbody class="table bg-transparent"

        >
          <div class="row bg-transparent" 
            *ngFor="let unconfirmedClass of unconfirmedClasses trackBy: trackByFn"
          >
            <app-unconfirmed-class [unconfirmedClass]=unconfirmedClass class="bg-transparent">
            </app-unconfirmed-class>
          </div>
        </tbody>
    </table>
</div>
