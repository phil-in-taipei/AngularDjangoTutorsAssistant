<div class="container bg-transparent py-4">
  <div class="row bg-transparent justify-content-center">
    <div class="col-12 col-md-12 col-lg-10 col-xl-8 bg-transparent">
      <form (submit)="onSubmit(recurringClassForm)"
            #recurringClassForm="ngForm" novalidate class="bg-transparent">

        <!-- Day of the week -->
        <div class="row bg-transparent g-3 mb-3">
          <div class="col-12 bg-transparent">
            <label for="day_of_week" class="form-label">Day of the Week</label>
            <hr class="thin-br" />
            <select id="day_of_week" class="form-select bg-transparent text-secondary border-secondary"
                    name="day_of_week" [(ngModel)]="dayOfWeek" required #day_of_week="ngModel"
                    [class.is-invalid]="day_of_week.touched && day_of_week.invalid">
              <option [ngValue]="null" disabled>Choose a day...</option>
              <option [ngValue]="0">Monday</option>
              <option [ngValue]="1">Tuesday</option>
              <option [ngValue]="2">Wednesday</option>
              <option [ngValue]="3">Thursday</option>
              <option [ngValue]="4">Friday</option>
              <option [ngValue]="5">Saturday</option>
              <option [ngValue]="6">Sunday</option>
            </select>
            <div class="invalid-feedback">Please choose a day of the week.</div>
          </div>
        </div>

        <!-- Start time + duration -->
        <div class="row bg-transparent g-3 mb-3">
          <div class="col-12 col-md-6 bg-transparent">
            <label class="form-label">Start Time</label>
            <div class="d-flex justify-content-center bg-transparent">
              <ngb-timepicker
                name="startTime"
                [(ngModel)]="startTime"
                [spinners]="true"
                [minuteStep]="5"
                [meridian]="false"
                required
                #startTimeCtrl="ngModel">
              </ngb-timepicker>
            </div>
            <div class="invalid-feedback d-block" *ngIf="startTimeCtrl.touched && startTimeCtrl.invalid">
              Please enter a start time.
            </div>
          </div>

          <div class="col-12 col-md-6 bg-transparent">
            <label for="duration" class="form-label">Class Duration</label>
            <hr class="thin-br" />
            <select id="duration" class="form-select bg-transparent text-secondary border-secondary"
                    name="duration" [(ngModel)]="duration" required #durationCtrl="ngModel"
                    [class.is-invalid]="durationCtrl.touched && durationCtrl.invalid">
              <option [ngValue]="null" disabled>Choose a duration...</option>
              <option *ngFor="let opt of classDurationOptions" [ngValue]="opt">
                {{ opt.stringVal }}
              </option>
            </select>
            <div class="invalid-feedback">Please choose a duration.</div>
            <hr class="thin-br" />
          </div>
        </div>

        <!-- Location -->
        <div class="row bg-transparent g-3 mb-3">
          <div class="col-12 bg-transparent">
            <label for="recurring_location" class="form-label">
              Location <span class="small">(optional)</span>
            </label>
            <hr class="thin-br" />
            <select id="recurring_location"
                    class="form-select bg-transparent text-secondary border-secondary"
                    name="recurring_location" [(ngModel)]="location">
              <option [ngValue]="null">No location</option>
              <option *ngFor="let venueSpace of venueSpaces" [ngValue]="venueSpace.id">
                {{ venueSpace.space_name }}, {{ venueSpace.venue.venue_name }}:
                {{ venueSpace.number_of_seats }} seats
              </option>
            </select>
          </div>
        </div>

        <hr class="thin-br" />

        <div class="d-grid d-md-flex justify-content-md-start bg-transparent">
          <button class="btn btn-outline-danger px-4" type="submit">Save Changes</button>
        </div>
      </form>
    </div>
  </div>
</div>
