<br />
<h2>Edit Recurring Class</h2>

<div *ngIf="errorMessage$ | async as classErrMsg">
  <div class="container">
    <div class="alert alert-danger alert-dismissible fade show" role="alert">
      <h5 class="text-center">{{ classErrMsg }}</h5>
      <button type="button" class="btn-close" (click)="onClearStatusMsgs()"
      data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </div>
</div>

<div *ngIf="successMessage$ | async as classSuccessMsg">
  <div class="container">
    <div class="alert alert-secondary alert-dismissible fade show" role="alert">
      <h5 class="text-center">{{ classSuccessMsg }}</h5>
      <button type="button" class="btn-close" (click)="onClearStatusMsgs()"
      data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
  </div>
</div>


<div *ngIf="recurringClass$ | async as recurringClass; else loading" class="container">
  <div *ngIf="venueSpaces$ | async as venueSpaces">
    <h3 class="text-center">
      <app-student-or-class-templ-string
        [studentOrClassId]="recurringClass.student_or_class">
      </app-student-or-class-templ-string>
    </h3>
    <div class="text-center mb-3">
      <hr class="thin-br" />
      <a class="btn btn-outline-danger" [routerLink]="['../../list']">
        Back to Recurring Classes
      </a>
      <hr class="thin-br" />

    </div>
    <app-edit-recurring-class-form
      [recurringClass]="recurringClass"
      [venueSpaces]="venueSpaces">
    </app-edit-recurring-class-form>
    <hr class="thin-br" />
  </div>
</div>

<ng-template #loading>
  <div class="text-center">
    <div class="spinner-border text-secondary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</ng-template>
